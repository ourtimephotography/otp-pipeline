<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Find my booking · Our Time Photography</title>
<link rel="icon" href="https://pay.ourtimephoto.com/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="https://pay.ourtimephoto.com/favicon-32.png">
<link rel="apple-touch-icon" href="https://pay.ourtimephoto.com/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Libre+Caslon+Display&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f4f4ef; --ink:#1d2320; --muted:#545d57; --amber:#b9781f; --btn-ink:#1d1608; --line:#d4d6cc; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font:16px/1.6 Figtree, Helvetica, Arial, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 20px; }
  .brand { font-family:Georgia, serif; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .brand a { color:inherit; text-decoration:none; }
  h1 { font-family:"Libre Caslon Display", Georgia, serif; font-weight:400; font-size:34px; line-height:1.15; margin:0 0 16px; }
  p { margin:0 0 14px; }
  label { display:block; font-weight:600; margin:18px 0 6px; }
  input[type=email] { width:100%; font:inherit; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  input[type=email]:focus { outline:2px solid var(--amber); outline-offset:1px; }
  button { margin-top:14px; border:0; cursor:pointer; background:var(--amber); color:var(--btn-ink); font:600 16px Figtree, Helvetica, Arial, sans-serif; padding:14px 24px; border-radius:999px; }
  button[disabled] { opacity:.6; cursor:default; }
  .err { color:#9b2c1f; font-size:14px; margin-top:8px; min-height:20px; }
  .note { color:var(--muted); font-size:14px; margin-top:22px; }
  .note a { color:#8f5a12; }
</style>
</head>
<body>
<main>
  <div class="brand"><a href="https://www.ourtimephoto.com/">Our Time Photography</a></div>
  <h1 id="title">Find my booking</h1>
  <div id="form-wrap">
    <p>Type the email you booked with and we’ll email you the link to your booking page: your signed agreement, payments and session details.</p>
    <form id="f" novalidate>
      <label for="email">Your email</label>
      <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <div class="err" id="err" role="alert"></div>
      <button id="go" type="submit">Email me my booking link</button>
    </form>
  </div>
  <p class="note">Questions? Reply to any email from us, or write to <a href="mailto:info@ourtimephoto.com">info@ourtimephoto.com</a>.</p>
</main>
<script>
// Asks Our Time Autopilot (a Google Apps Script web app) to email the booking page link. The answer never says whether a
// booking exists, so this page can't be used to check on someone else.
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbyqwtOZUSeqGhUXUH1q2kZQAa2-IRcblQt-Tp0RmKp1J86BY4MDPvkZF7bYCprv-y42cg/exec';
  var form = document.getElementById('f'), input = document.getElementById('email'), err = document.getElementById('err'), go = document.getElementById('go');
  input.addEventListener('input', function () { err.textContent = ''; });
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = input.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { err.textContent = 'Please type the email you booked with.'; input.focus(); return; }
    go.disabled = true; go.textContent = 'Sending…';
    fetch(API + '?action=findbooking&email=' + encodeURIComponent(email), {credentials: 'omit', redirect: 'follow'})
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) throw new Error('bad');
        document.getElementById('title').textContent = 'Check your email';
        document.getElementById('form-wrap').innerHTML = '<p>If we have a booking for <b></b>, the link to your booking page is on its way. It can take a few minutes.</p>' +
          '<p>Nothing after 15 minutes? Check spam, try the email you first contacted us with, or just reply to any of our emails.</p>';
        document.querySelector('#form-wrap b').textContent = email;
      })
      .catch(function () {
        go.disabled = false; go.textContent = 'Email me my booking link';
        err.textContent = 'We couldn’t reach our booking system just now. Please try again in a minute.';
      });
  });
})();
</script>
</body>
</html>
