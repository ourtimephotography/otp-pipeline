<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Our Time pipeline strip for Notion job pages.
     URL: ?job=<page id>&sig=<signature>&stage=<1-9>&api=<OTP Payments web app /exec URL>
     Clicking a stage asks the web app to set the job's "Pipeline stage"; "Auto" clears it. */
  :root { --paper:#f4f4ef; --paper2:#e9eae2; --ink:#1d2320; --soft:#545d57; --mute:#8a918b; --amber:#b9781f; --amberInk:#1d1608; }
  html, body { margin:0; background:transparent; font-family:Figtree, Helvetica, Arial, sans-serif; }
  .row { display:flex; gap:4px; padding:6px 2px; overflow-x:auto; }
  .s { flex:1 0 92px; display:flex; flex-direction:column; justify-content:center; gap:4px; min-height:64px;
       padding:8px 18px 8px 24px; box-sizing:border-box; border:0; text-align:left; font:inherit; cursor:pointer;
       clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);
       transition:filter .15s, transform .15s; }
  .s:first-child { clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%); padding-left:14px; border-radius:10px 0 0 10px; }
  .s:hover { filter:brightness(.96); }
  .k { font-size:12px; font-weight:700; letter-spacing:.06em; }
  .t { font-size:14px; font-weight:500; line-height:1.15; }
  .done { background:var(--paper2); color:var(--soft); }
  .now  { background:var(--amber); color:var(--amberInk); }
  .now .t { font-weight:700; }
  .next { background:var(--paper); color:var(--mute); }
  .bar { display:flex; justify-content:space-between; align-items:center; padding:2px 4px 0; font-size:12px; color:var(--mute); min-height:18px; }
  .bar button { border:0; background:none; font:inherit; color:var(--soft); cursor:pointer; text-decoration:underline; padding:0; }
</style>
</head>
<body>
<div class="row" id="row"></div>
<div class="bar"><span id="msg"></span><span id="mode"></span></div>
<script>
  const STAGES = ['Inquiry', 'Planning call', 'Quote', 'Booked', 'Signed + paid', 'Shoot', 'Editing', 'Delivered', 'Complete'];
  const q = new URLSearchParams(location.search);
  const job = q.get('job'), sig = q.get('sig'), api = q.get('api');
  let stage = Number(q.get('stage')) || 1, manual = false;

  function draw() {
    document.getElementById('row').innerHTML = STAGES.map((name, i) => {
      const st = i + 1 < stage ? 'done' : i + 1 === stage ? 'now' : 'next';
      return '<button class="s ' + st + '" data-n="' + (i + 1) + '" title="Set the job to ' + name + '">' +
        '<span class="k">' + (st === 'done' ? '✓' : i + 1) + '</span><span class="t">' + name + '</span></button>';
    }).join('');
    const mode = document.getElementById('mode');
    mode.innerHTML = !api ? '' : manual ? 'Set by hand · <button id="auto">back to automatic</button>' : 'Automatic';
    const a = document.getElementById('auto');
    if (a) a.onclick = () => save(0);
  }

  function call(params) {
    const u = api + '?' + new URLSearchParams(Object.assign({job: job, sig: sig}, params));
    return fetch(u).then(r => r.json());
  }

  function save(n) {
    if (!api || !job) return;
    const msg = document.getElementById('msg');
    msg.textContent = 'Saving…';
    call({action: 'set', stage: n}).then(r => {
      if (!r.ok) throw new Error(r.error || 'failed');
      stage = r.stage; manual = r.manual; draw();
      msg.textContent = 'Saved';
      setTimeout(() => { msg.textContent = ''; }, 2000);
    }).catch(e => { msg.textContent = 'Could not save (' + e.message + ')'; });
  }

  document.getElementById('row').addEventListener('click', e => {
    const b = e.target.closest('.s');
    if (b) save(Number(b.dataset.n));
  });

  draw();
  if (api && job) call({action: 'get'}).then(r => { if (r.ok) { stage = r.stage; manual = r.manual; draw(); } }).catch(() => {});
</script>
</body>
</html>
